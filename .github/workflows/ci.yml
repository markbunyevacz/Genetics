name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System font for Hungarian PDF
        run: sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core
      - name: PDF dependency
        run: pip install reportlab
      - name: Fetch PharmCAT jar pin (air-gap tests)
        run: python3 docs/pce/Sources/official/fetch_software_ready_pins.py --jar-only
      - name: Unit tests
        env:
          PCE_PHARMCAT_OFFLINE: "1"
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: LIVE_CDS and matcher freeze
        run: |
          python3 -c "import sys; sys.path.insert(0,'src'); from pce_gateway.flags import LIVE_CDS; assert LIVE_CDS is False"
          python3 -c "import sys; sys.path.insert(0,'src'); from pce_report.flags import MATCHER_ON, LIVE_CDS; assert MATCHER_ON is False and LIVE_CDS is False"
      - name: CPIC_F5_SOURCE freeze
        run: |
          python3 -c "import os; tok=(os.environ.get('CPIC_F5_SOURCE') or '').strip().lower(); assert tok != 'live'"
          python3 -c "import sys; sys.path.insert(0,'src'); from pce_shadow.f5_rec import F5Source, resolve_source; assert resolve_source(None) is F5Source.DISABLED; assert resolve_source(None) is not F5Source.LIVE"
          grep -q '^CPIC_F5_SOURCE=off$' config/production.env
          ! grep -E '^[[:space:]]*CPIC_F5_SOURCE=live' config/production.env
      - name: FR-id requirement-to-test trace
        run: PYTHONPATH=src python3 -m unittest tests.test_fr_trace.FrIdInventoryTests -v
      - name: FR-470 F1+ isolation
        run: |
          ! grep -R -n --include='*.py' "MedicationEntry" src/pce_report
          ! grep -R -n --include='*.py' "medication_entry" src/pce_report
          ! grep -R -n --include='*.py' "pce_gateway.pipeline" src/pce_report
          ! grep -R -n -E -i --include='*.py' 'openai|anthropic|langchain' src/pce_report src/pce_clinical
          ! grep -R -n --include='*.py' "pce_shadow" src/pce_report
          ! grep -R -n --include='*.py' "pce_cds" src/pce_report src/pce_clinical
      - name: FR-470 R9 deny-list matches schema
        run: PYTHONPATH=src python3 -m unittest tests.test_report.B41ContractTests.test_delivery_plan_r9_matches_schema
